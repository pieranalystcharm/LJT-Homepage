name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions: write-all

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages via github-script
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const result = await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow'
              });
              console.log('Pages enabled:', JSON.stringify(result.data));
            } catch (error) {
              console.log('Error:', error.message, error.status);
            }
            try {
              const status = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              console.log('Pages status:', JSON.stringify(status.data));
            } catch (error) {
              console.log('Status error:', error.message, error.status);
            }
