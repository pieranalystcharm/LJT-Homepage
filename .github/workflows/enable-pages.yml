name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages via configure-pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Show Pages outputs
        run: |
          echo "base_path: ${{ steps.pages.outputs.base_path }}"
          echo "base_url: ${{ steps.pages.outputs.base_url }}"
          echo "origin: ${{ steps.pages.outputs.origin }}"
          echo "host: ${{ steps.pages.outputs.host }}"
          echo "server_url: ${{ steps.pages.outputs.server_url }}"
          echo "html_url: ${{ steps.pages.outputs.html_url }}"
